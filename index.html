<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>试玩目录</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 20%, #2a120e 0%, #0b0a09 55%);
        color: #f3e6c5;
        font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
      }
      main { width: min(420px, 92vw); padding: 24px 8px 48px; }
      h1 { margin: 0 0 8px; font-size: 28px; color: #e4b84a; letter-spacing: 0.18em; }
      p { margin: 0 0 24px; opacity: 0.78; }
      nav { display: grid; gap: 12px; }
      a {
        display: block;
        padding: 18px 16px;
        border: 1px solid #e4b84a66;
        border-radius: 12px;
        color: inherit;
        text-decoration: none;
        background: #1a100c;
      }
      a:hover { border-color: #e4b84a; }
      strong { color: #e4b84a; }
      small { display: block; margin-top: 6px; opacity: 0.65; }
    </style>
  </head>
  <body>
    <main>
      <h1>试玩目录</h1>
      <p>每个游戏独占一级路径，互不抢根目录。</p>
      <nav>
        <a href="./zaohua-xianfu/">
          <strong>造化仙府</strong>
          <small>/zaohua-xianfu/ · 洞府经营 · 修仙放置</small>
        </a>
        <a href="./zhao-yun-adou/">
          <strong>赵云与阿斗</strong>
          <small>/zhao-yun-adou/ · 汉字合成 · 水墨塔防</small>
        </a>
        <a href="./bingqi-wangzhe/">
          <strong>兵器王者·炉火</strong>
          <small>/bingqi-wangzhe/ · 寻器 · 造器 · 用器</small>
        </a>
      </nav>
    </main>
  </body>
</html>
