<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b140f" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="造化仙府：洞府经营与修仙放置的网页复刻，建洞府、派弟子、御兽潮、登天塔。" />
    <title>造化仙府 · 洞天</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
       * UI 层附加样式（归属：index.html）。
       * 只补 src/ui 新增组件与窄屏适配，不覆写 src/styles/** 的既有观感；
       * 窄屏规则统一加 body 前缀提高优先级，免受样式表注入顺序影响。
       */

      /* —— 新组件 —— */
      .side-stack { display: flex; flex-direction: column; gap: 0.8rem; }
      .offline-box { margin: 0.6rem 1.2rem 0; }
      .panel-summary p { margin: 0.2rem 0; }
      .rate-line { font-variant-numeric: tabular-nums; }
      .res-bar .rate { font-style: normal; font-size: 0.72rem; color: var(--wash); margin-left: 0.25rem; }

      .d-chip {
        display: inline-block;
        padding: 0.05rem 0.4rem;
        margin-left: 0.3rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 0.7rem;
        line-height: 1.5;
        color: var(--paper-dim);
        vertical-align: middle;
        white-space: nowrap;
      }
      .d-chip.gold { border-color: rgba(212, 160, 23, 0.5); color: var(--gold); }
      .d-chip.cin { border-color: rgba(194, 59, 34, 0.55); color: #f0a090; }

      .disciple-card, .recruit-card { align-items: flex-start; }
      .d-main { min-width: 0; flex: 1 1 auto; }
      .d-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.15rem; }
      .d-flavor, .d-skill { font-size: 0.78rem; margin-top: 0.15rem; }
      .d-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 0.15rem 0.7rem;
        margin-top: 0.25rem;
        font-size: 0.8rem;
        font-variant-numeric: tabular-nums;
      }
      .d-stats b { color: var(--gold); font-weight: 600; }
      .d-post { margin-top: 0.35rem; font-size: 0.82rem; }
      .d-post.idle { color: var(--paper-dim); }
      .d-xp { margin-top: 0.35rem; font-size: 0.75rem; }
      .d-xp .hpbar.thin { height: 5px; margin-bottom: 0.15rem; }
      .d-acts { display: flex; flex-direction: column; align-items: stretch; gap: 0.3rem; flex: 0 0 auto; }
      .d-acts .cost { font-size: 0.72rem; opacity: 0.85; }
      .d-acts .lack { font-size: 0.7rem; text-align: center; }
      .assign-panel { margin: -0.2rem 0 0.5rem; background: rgba(27, 20, 15, 0.55); }
      .assign-panel p { margin: 0 0 0.2rem; font-size: 0.78rem; }
      .tip-list { margin: 0.2rem 0 0; padding-left: 1.1rem; font-size: 0.82rem; color: var(--paper-dim); }
      .tip-list li { margin: 0.2rem 0; }
      h4.sub { margin: 0.7rem 0 0; font-size: 0.85rem; letter-spacing: 0.08em; color: var(--wash); }

      .plot .pname { font-size: 0.72rem; }
      .plot .plot-empty { font-size: 0.75rem; opacity: 0.35; }
      .plot .staff-dot {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: transparent;
        border: 1px solid rgba(243, 230, 201, 0.35);
      }
      .plot .staff-dot.on { background: var(--spirit); border-color: var(--spirit); box-shadow: 0 0 6px var(--spirit); }

      .gate-card label { display: block; margin-bottom: 0.25rem; }
      .gate-card #dao-name {
        font-family: inherit;
        font-size: 1rem; /* 16px 起，iOS 聚焦时不再强制缩放 */
        color: inherit;
        background: rgba(27, 20, 15, 0.6);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0.5rem 0.7rem;
        width: min(18rem, 100%);
        text-align: center;
      }
      .gate-card #dao-name:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
      .gate-hint { font-size: 0.72rem; margin-top: 0.4rem; }

      /* —— 窄屏适配 —— */
      @media (max-width: 860px) {
        body .topbar {
          display: grid;
          grid-template-columns: 1fr auto;
          align-items: center;
          gap: 0.35rem 0.6rem;
          padding: 0.6rem 0.9rem;
        }
        body .topbar .brand { grid-column: 1; grid-row: 1; font-size: 1.5rem; }
        body .topbar > button { grid-column: 2; grid-row: 1; }
        body .topbar .res-bar { grid-column: 1 / -1; grid-row: 2; }
      }

      @media (max-width: 700px) {
        body .nav { padding: 0.5rem 0.9rem 0; gap: 0.3rem; }
        body .nav button { padding: 0.45rem 0.55rem; font-size: 0.9rem; }
        body .stage { padding: 0.7rem 0.9rem 1.6rem; }
        body .offline-box { margin: 0.6rem 0.9rem 0; }
        body .card { padding: 0.75rem 0.8rem; }
        body .res-bar { font-size: 0.8rem; gap: 0.35rem 0.7rem; }
        body .res-bar .rate { display: none; }

        body .plot-grid { max-width: none; gap: 4px; }
        body .plot { min-height: 0; }
        body .plot .glyph { font-size: 1.2rem; }
        body .plot .pname { display: none; }
        body .plot .lv { font-size: 0.62rem; }

        body .hero-card, body .art-card { flex-direction: column; align-items: stretch; }
        body .d-acts { flex-direction: row; flex-wrap: wrap; }
        body .d-acts button { flex: 1 1 8rem; min-height: 2.4rem; }
        body .d-acts .lack { flex: 1 1 100%; text-align: left; }
        body .build-list button { min-height: 2.3rem; }
        body .log-list { max-height: 140px; }
      }

      @media (max-width: 420px) {
        body .brand { font-size: 1.3rem; }
        body .gate { padding: 1rem 0.8rem; }
        body .d-stats { font-size: 0.76rem; }
        body .build-list { gap: 0.35rem; }
        body .build-list button { flex: 1 1 100%; text-align: left; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 2rem; text-align: center">造化仙府需要启用 JavaScript 才能开府。</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
