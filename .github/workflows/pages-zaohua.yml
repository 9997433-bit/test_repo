name: Deploy 造化仙府 to Pages

on:
  push:
    branches: [main]
    paths:
      - "games/zaohua-xianfu/**"
      - ".github/workflows/pages-zaohua.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-zaohua
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: games/zaohua-xianfu/package-lock.json
      - name: Install and build
        working-directory: games/zaohua-xianfu
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: games/zaohua-xianfu/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
